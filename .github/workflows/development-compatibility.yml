name: Development compatibility
on:
  pull_request:
  push:
    branches: ['fix/windows-*']
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - run: pnpm install --frozen-lockfile
      - run: npm --prefix agent ci
      - run: npm --prefix agent test
      - run: node --test tests/agent-auth.test.mjs tests/agent-pb-auth.test.mjs tests/agent-canvas-save.test.mjs tests/agent-script-paths.test.mjs tests/windows-launcher.test.mjs
      - run: npm --prefix agent run smoke:mock
      - run: npm run build
